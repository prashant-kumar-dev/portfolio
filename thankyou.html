<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>Message sent | Prashant Kumar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-body min-vh-100 d-flex align-items-center">
    <div class="container text-center py-5 px-3" style="max-width: 28rem;">
        <h1 class="h3 mb-3">Thanks for reaching out</h1>
        <p class="text-body-secondary mb-4">Your message was received. I will get back to you when I can.</p>
        <a href="index.html" class="btn btn-primary rounded-pill px-4">Back to portfolio</a>
    </div>
    <script>
(function () {
  try {
    var raw = localStorage.getItem("toggle-bootstrap-theme");
    if (raw) {
      var data = JSON.parse(raw);
      if (data && typeof data.isDark === "boolean") {
        document.documentElement.setAttribute("data-bs-theme", data.isDark ? "dark" : "light");
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", data.isDark ? "#12151c" : "#0d6efd");
      }
    }
  } catch (e) {}
})();
    </script>
</body>

</html>
